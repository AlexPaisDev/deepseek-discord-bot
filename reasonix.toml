allow = ["Edit", "Bash=py -m py_compile bot.py config.py cogs/__init__.py cogs/ai_agent.py cogs/balance.py; if ($?) { Write-Output \"PY_COMPILE_OK\" }", "Bash=py -X utf8 -c \"\nimport config\nimport cogs.ai_agent\nimport cogs.balance\nimport bot\nprint('OK: all modules import cleanly')\n\n# Config fails fast without secrets\nimport os\nos.environ.pop('DISCORD_TOKEN', None)\nos.environ.pop('DEEPSEEK_API_KEY', None)\nfrom config import Config, ConfigError\ntry:\n    Config.from_env()\nexcept ConfigError:\n    print('OK: Config.from_env raises ConfigError without secrets')\nelse:\n    raise SystemExit('FAIL: expected ConfigError without secrets')\n\n# New defaults\nos.environ['DISCORD_TOKEN'] = 'x'\nos.environ['DEEPSEEK_API_KEY'] = 'y'\nc = Config.from_env()\nassert c.deepseek_model == 'deepseek-chat', c.deepseek_model\nassert c.bot_status == 'DeepSeek — /ask or @mention me', c.bot_status\nassert c.ask_cooldown_rate == 5 and c.ask_cooldown_period_seconds == 60.0\nprint('OK: new defaults (model, status, cooldown)')\n\"", "Bash=Write-Output \"ENV: [$env:DEEPSEEK_MODEL]\"; Get-ChildItem -Path D:\\Dev\\GithubProjects -Filter \".env\" -Force -ErrorAction SilentlyContinue | Select-Object FullName; Get-ChildItem -Path D:\\Dev -Filter \".env\" -Force -ErrorAction SilentlyContinue | Select-Object FullName", "Bash=Get-ChildItem -Force -Filter \"*.env*\" | Select-Object Name; Write-Output \"---\"; py -X utf8 -c \"\nimport os\nprint('before load_dotenv:', repr(os.getenv('DEEPSEEK_MODEL')))\nfrom dotenv import load_dotenv\nloaded = load_dotenv()\nprint('dotenv loaded:', loaded)\nprint('after load_dotenv:', repr(os.getenv('DEEPSEEK_MODEL')))\nimport config\nprint('config module env:', repr(os.getenv('DEEPSEEK_MODEL')))\n\"", "Bash=py -X utf8 -c \"\nimport os\nos.environ['DISCORD_TOKEN'] = 'x'\nos.environ['DEEPSEEK_API_KEY'] = 'y'\nos.environ.pop('DEEPSEEK_MODEL', None)\nfrom config import Config, ConfigError\nc = Config.from_env()\nassert c.deepseek_model == 'deepseek-chat', c.deepseek_model\nassert c.bot_status == 'DeepSeek — /ask or @mention me', c.bot_status\nassert c.ask_cooldown_rate == 5 and c.ask_cooldown_period_seconds == 60.0\nassert c.ask_cooldown_rate == 5\n# env overrides still work\nos.environ['DEEPSEEK_MODEL'] = 'deepseek-reasoner'\nos.environ['ASK_COOLDOWN_RATE'] = '0'\nc2 = Config.from_env()\nassert c2.deepseek_model == 'deepseek-reasoner'\nassert c2.ask_cooldown_rate == 0\nprint('OK: config defaults + overrides')\n\"", "Bash=py -m py_compile cogs/ai_agent.py; if ($?) { Write-Output \"PY_COMPILE_OK\" }\npy -X utf8 -c \"import asyncio; from cogs.ai_agent import AIAgentCog\ncog = object.__new__(AIAgentCog); cog._locks = {}; cog.memories = {}\nN = AIAgentCog.CHANNEL_CACHE_MAX\nfor i in range(N):\n    cog._locks[i] = asyncio.Lock()\n# a live conversation: memory entry present, lock busy\ncog.memories[42] = object()\nbusy = cog._locks[42]\nasync def main():\n    await busy.acquire()\n    # cache full, adding a new channel\n    new = cog._lock_for(N)\n    assert len(cog._locks) == N, len(cog._locks)\n    assert cog._locks[42] is busy            # live channel lock kept\n    assert cog._locks[0] is not cog._locks.get(N) or N in cog._locks\n    assert new is cog._locks[N]\n    # leaked lock (no memory) is evicted; live lock survives\n    assert 0 not in cog._locks or len(cog._locks) == N\n    busy.release()\n    # after /clear, the channel's lock becomes evictable\n    cog.memories.pop(42, None)\n    before = set(cog._locks)\n    cog._lock_for(N + 1)\n    assert 42 in before and 42 not in cog._locks, set(cog._locks)\nasyncio.run(main())\nprint('OK: lock eviction keeps live locks, evicts leaked ones')\n\"", "Bash=py -m py_compile cogs/ai_agent.py; if ($?) { Write-Output \"PY_COMPILE_OK\" }\npy -X utf8 -c \"import asyncio; from cogs.ai_agent import AIAgentCog\nclass TinyCog(AIAgentCog):\n    CHANNEL_CACHE_MAX = 3\ncog = object.__new__(TinyCog); cog._locks = {}; cog.memories = {}\ncog.memories[1] = object()          # live conversation channel\ncog._locks[1] = asyncio.Lock()\ncog._locks[2] = asyncio.Lock()      # leaked (no memory)\nasync def main():\n    await cog._locks[1].acquire()\n    cog._lock_for(3)                                    # cache size 2 < 3: no eviction\n    assert set(cog._locks) == {1, 2, 3}\n    cog._lock_for(4)                                    # full: evicts leaked 2, keeps live 1\n    assert set(cog._locks) == {1, 3, 4}, set(cog._locks)\n    cog._locks[1].release()\n    cog.memories.pop(1, None)                           # simulate /clear\n    cog._lock_for(5)                                    # 1 now eligible (no memory, unlocked)\n    assert set(cog._locks) == {3, 4, 5}, set(cog._locks)\nasyncio.run(main())\nprint('OK: lock eviction tied to memory lifetime')\n\""]
