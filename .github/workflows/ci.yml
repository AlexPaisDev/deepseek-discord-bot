# GitHub Actions CI — verifies the codebase in the cloud on every push,
# so you never need Python installed locally to test changes.
name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Verify (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check (py_compile)
        run: python -m py_compile bot.py config.py cogs/__init__.py cogs/ai_agent.py cogs/balance.py

      - name: Import check (no credentials needed)
        run: |
          python - <<'EOF'
          import config
          import cogs.ai_agent
          import bot
          print("OK: all modules import cleanly")
          EOF

      - name: Config fails fast without secrets
        run: |
          python - <<'EOF'
          import os

          os.environ.pop("DISCORD_TOKEN", None)
          os.environ.pop("DEEPSEEK_API_KEY", None)

          from config import Config, ConfigError

          try:
              Config.from_env()
          except ConfigError:
              print("OK: Config.from_env raises ConfigError without secrets")
          else:
              raise SystemExit("FAIL: expected ConfigError without secrets")
          EOF

      - name: Unit check — chunk_text
        run: |
          python - <<'EOF'
          from cogs.ai_agent import chunk_text

          # Hard-split of a single over-long line.
          assert chunk_text("a" * 5000) == ["a" * 1900, "a" * 1900, "a" * 1200]

          # Line-aware splitting never exceeds the 1900-char limit.
          text = "\n".join(f"line-{i}" for i in range(400))
          chunks = chunk_text(text)
          assert len(chunks) > 1
          assert all(len(c) <= 1900 for c in chunks)

          print("OK: chunk_text splits correctly")
          EOF

      - name: Unit check — rate limiter + balance permissions
        run: |
          python - <<'EOF'
          from cogs.ai_agent import UserRateLimiter

          # Sliding window: max 2 requests per second per user.
          rl = UserRateLimiter(2, 1.0)
          assert rl.allow(1) and rl.allow(1) and not rl.allow(1)
          assert rl.allow(2)  # a different user is unaffected

          # rate=0 disables the limiter entirely.
          assert UserRateLimiter(0, 1.0).allow(99)

          print("OK: rate limiter")

          from cogs.balance import BalanceCog

          class Perms:
              administrator = False
              manage_guild = False

          class Author:
              id = 1
              guild_permissions = Perms()

          class Guild:
              owner_id = 1

          class Ctx:
              guild = Guild()
              author = Author()

          # Guild owner is privileged.
          assert BalanceCog._is_privileged(Ctx())

          # A plain member is not; admin / manage-guild permissions are.
          class Ctx2:
              guild = type("G", (), {"owner_id": 2})()
              author = type("A", (), {"id": 3, "guild_permissions": Perms()})()

          assert not BalanceCog._is_privileged(Ctx2())
          Perms.administrator = True
          assert BalanceCog._is_privileged(Ctx2())
          Perms.administrator = False
          Perms.manage_guild = True
          assert BalanceCog._is_privileged(Ctx2())

          # DMs (no guild) are always denied.
          assert not BalanceCog._is_privileged(type("DM", (), {"guild": None})())

          print("OK: balance permissions")
          EOF

      - name: Unit check — sender name tagging
        run: |
          python - <<'EOF'
          from cogs.ai_agent import ConversationMemory, _api_user_message

          # Valid identifier → native name field.
          m = _api_user_message("bora malta", "ninjaboypt")
          assert m == {"role": "user", "name": "ninjaboypt", "content": "bora malta"}, m

          # Invalid identifier (dot / space / unicode) → content prefix fallback.
          m = _api_user_message("yo", "bigmike._.")
          assert m == {"role": "user", "content": "bigmike._.: yo"}, m
          assert _api_user_message("x", "nome com espacos")["content"].startswith("nome com espacos: ")
          assert _api_user_message("x", "josé")["content"].startswith("josé: ")

          # Boundary cases: single char and 64-char names fit the native field,
          # 65 chars and the empty string fall back.
          assert _api_user_message("x", "a")["name"] == "a"
          assert _api_user_message("x", "a" * 64)["name"] == "a" * 64
          assert _api_user_message("x", "a" * 65)["content"].startswith("a" * 65 + ": ")
          assert "name" not in _api_user_message("x", "")

          # Memory attaches the name when provided, stays plain otherwise.
          mem = ConversationMemory(10)
          mem.add_user("oi", "caldo")
          mem.add_user("oi")
          assert mem.messages[0]["name"] == "caldo"
          assert "name" not in mem.messages[1]

          print("OK: sender name tagging")
          EOF

      - name: Unit check — context trimming
        run: |
          python - <<'EOF'
          from cogs.ai_agent import ConversationMemory

          mem = ConversationMemory(50)
          for i in range(1, 5):            # u1 a1 u2 a2 u3 a3 u4 a4
              mem.add_user(f"u{i}")
              mem.add_assistant(f"a{i}")

          # Cap of 2 keeps the last 2 bot replies and everything after them.
          msgs = mem.to_api_messages("sys", max_assistant=2)
          assert msgs[0] == {"role": "system", "content": "sys"}
          assert [m["content"] for m in msgs[1:]] == ["u3", "a3", "u4", "a4"]

          # No cap → full history untouched.
          assert len(mem.to_api_messages("sys")) == 1 + 8

          # Config default (4) is larger than the history → nothing trimmed.
          assert len(mem.to_api_messages("sys", max_assistant=4)) == 1 + 8

          # max_assistant=1 keeps just the last exchange (incl. its prompt).
          t = mem.to_api_messages("sys", max_assistant=1)
          assert [m["content"] for m in t[1:]] == ["u4", "a4"]

          # Trailing user message (reply not stored yet, e.g. mid-stream) is kept.
          mem.add_user("u5")
          t = mem.to_api_messages("sys", max_assistant=1)
          assert [m["content"] for m in t[1:]] == ["u4", "a4", "u5"]

          print("OK: context trimming")
          EOF

      - name: Unit check — agent tools
        run: |
          python - <<'EOF'
          import asyncio
          import tools
          from tools import truncate, parse_duckduckgo_results, parse_tenor_results

          assert truncate("abc", 10) == "abc"
          assert truncate("x" * 50, 10).endswith("[truncado]")

          # DuckDuckGo HTML parser (redirect link + snippet).
          html = (
              '<div class="result"><a class="result__a" href="//duckduckgo.com/l/?uddg=https%3A%2F%2Fexample.com%2Fpage&rut=x">Titulo</a>'
              '<a class="result__snippet" href="//duckduckgo.com/l/?uddg=x">Snippet.</a></div>'
          )
          res = parse_duckduckgo_results(html)
          assert res == [{"title": "Titulo", "url": "https://example.com/page", "snippet": "Snippet."}], res

          # Tenor parser.
          payload = {"results": [{"content_description": "palmas", "media_formats": {"mediumgif": {"url": "https://media.tenor.com/a.gif"}}}]}
          g = parse_tenor_results(payload)
          assert g == [{"title": "palmas", "url": "https://media.tenor.com/a.gif", "preview": ""}], g

          # GIF tool is only advertised when a Tenor key exists.
          assert [s["function"]["name"] for s in tools.tool_schemas("")] == ["web_search", "fetch_page"]
          assert "search_gifs" in [s["function"]["name"] for s in tools.tool_schemas("K")]

          # Unknown tool name → error string, never raises.
          assert "desconhecida" in asyncio.run(tools.run_tool("nope", {}))

          # Tool-call loop with a stubbed client.
          import cogs.ai_agent as aa
          from config import Config

          class TC:
              def __init__(self, id_, name, args):
                  self.id, self.function, self.type = id_, type("F", (), {"name": name, "arguments": args})(), "function"
              def model_dump(self):
                  return {"id": self.id, "type": self.type, "function": {"name": self.function.name, "arguments": self.function.arguments}}

          class Msg:
              def __init__(self, content=None, tool_calls=None):
                  self.content, self.tool_calls = content, tool_calls

          class Completions:
              def __init__(self, script):
                  self.script, self.calls = list(script), 0
              async def create(self, **kw):
                  step = self.script[min(self.calls, len(self.script) - 1)]
                  self.calls += 1
                  self.last_kwargs = kw
                  return type("C", (), {"choices": [type("Ch", (), {"message": step})()]})()

          class Client:
              def __init__(self, script):
                  self.chat = type("Chat", (), {"completions": Completions(script)})()

          async def fake_tool(name, arguments, *, tenor_api_key="", max_chars=2000):
              return "RESULTADO"

          tools.run_tool = fake_tool  # patched via module attribute
          config = Config(discord_token="x", deepseek_api_key="y", tenor_api_key="K", max_tool_iterations=3)
          cog = object.__new__(aa.AIAgentCog)
          cog.config = config
          cog.client = Client([Msg(tool_calls=[TC("c1", "web_search", '{"query": "x"}')]), Msg(content="resposta")])
          msgs, reply = asyncio.run(cog._run_tool_loop([{"role": "user", "content": "oi"}], None))
          assert reply == "resposta"
          assert [m["role"] for m in msgs] == ["user", "assistant", "tool"]
          assert msgs[2]["tool_call_id"] == "c1" and msgs[2]["content"] == "RESULTADO"

          print("OK: agent tools")
          EOF
